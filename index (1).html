<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toko Tani — Pembukuan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <div class="brand">Toko Tani<small>Pembukuan harian</small></div>
